[package]
name = "doftar"
version = "0.1.0"
description = "An Explorer-style file manager for macOS, with tabs, a command bar and a navigation pane"
authors = ["Hasanul Banna Siam"]
license = "Apache-2.0"
edition = "2021"

# Capitalized so the process name (Dock, ⌘-Tab, Activity Monitor) reads
# "Doftar" in `tauri dev` too; bundles get it from `mainBinaryName`.
[[bin]]
name = "Doftar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
libc = "0.2"
fs2 = "0.4"
dirs = "5"
plist = "1"
tauri-plugin-drag = "2.1.1"
pulldown-cmark = { version = "0.13.5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSSharingService", "NSView", "NSResponder", "NSScreen", "NSAnimation", "NSAnimationContext", "NSAccessibility", "NSColor", "NSColorSpace", "NSGraphics", "NSImage", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CAMediaTimingFunction", "CALayer", "CATransaction"] }
objc2-web-kit = { version = "0.3", features = ["WKWebViewConfiguration", "WKPreferences"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSFileManager", "NSError", "NSGeometry", "NSData", "NSNotification", "NSOperation", "NSObject", "NSDictionary", "NSNull", "block2"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFView", "PDFDocument", "PDFPage", "PDFSelection", "PDFThumbnailView", "PDFAction", "PDFActionRemoteGoTo"] }
block2 = "0.6"
objc2-quick-look-ui = { version = "0.3", features = ["QLPreviewPanel", "QLPreviewItem"] }
objc2-core-foundation = { version = "0.3", features = ["CFString", "CFURL", "CFDictionary", "CFNumber", "CFArray", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "block2", "objc2-core-foundation", "objc2-core-graphics"] }

[profile.dev]
incremental = true
