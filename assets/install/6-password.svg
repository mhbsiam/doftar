<svg xmlns="http://www.w3.org/2000/svg" viewBox="176 0 368 450" width="368" height="450" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Install step 6. See 1-download.svg for how to regenerate the PNGs. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c5c60"/><stop offset="1" stop-color="#464649"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <rect x="200" y="48" width="320" height="354" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity="0.16" filter="url(#shadow)"/>

  <!-- Touch ID icon with the Privacy & Security badge -->
  <g transform="translate(328 72)">
    <circle cx="32" cy="32" r="30" fill="#f6f6f8"/>
    <g fill="none" stroke="#ff375f" stroke-width="2.4" stroke-linecap="round" transform="rotate(-150 32 33)">
      <circle cx="32" cy="33" r="4" stroke-dasharray="12 40"/>
      <circle cx="32" cy="33" r="8.5" stroke-dasharray="30 6 10 60"/>
      <circle cx="32" cy="33" r="13" stroke-dasharray="46 8 16 30"/>
      <circle cx="32" cy="33" r="17.5" stroke-dasharray="64 10 20 30"/>
      <circle cx="32" cy="33" r="22" stroke-dasharray="78 14 24 40"/>
    </g>
    <rect x="44" y="44" width="24" height="24" rx="7" fill="#0a84ff" stroke="#464649" stroke-width="2"/>
    <path d="M50 58 v-6 M53.5 56 v-8 M57 56 v-8.5 M60.5 57 v-6.5 M49 57 q1 7 7 7 q5 0 6 -5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-size="14" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="360" y="166">You are attempting to open an app</text>
    <text x="360" y="185">that may cause harm to your Mac or</text>
    <text x="360" y="204">compromise your privacy</text>
  </g>
  <g font-size="13.5" fill="#dcdcde" text-anchor="middle">
    <text x="360" y="228">Touch ID or enter an administrator’s</text>
    <text x="360" y="247">name and password to continue with</text>
    <text x="360" y="266">Privacy &amp; Security.</text>
  </g>

  <rect x="224" y="296" width="272" height="36" rx="18" fill="#6a6a6e"/>
  <text x="360" y="319" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Use Password…</text>
  <rect x="217" y="289" width="286" height="50" rx="25" fill="none" stroke="#ff9f0a" stroke-width="3.5"/>
  <rect x="224" y="342" width="272" height="36" rx="18" fill="#6a6a6e"/>
  <text x="360" y="365" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Cancel</text>
</svg>
