<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 450" width="548" height="450" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Install steps 1 to 6, drawn after the real macOS windows for the README
     and the site. No background, so they sit on any page. Regenerate every PNG with:
     for f in assets/install/*.svg; do rsvg-convert -z 2 "$f" -o "docs/assets/install/$(basename "${f%.svg}").png"; done -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <!-- The latest release page in a browser -->
  <rect x="24" y="60" width="500" height="330" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="50" cy="85" r="6.5" fill="#ff5f57"/><circle cx="71" cy="85" r="6.5" fill="#febc2e"/><circle cx="92" cy="85" r="6.5" fill="#28c840"/>
  <rect x="124" y="72" width="300" height="26" rx="8" fill="#efeff1"/>
  <text x="274" y="89" font-size="11.5" fill="#6e6e73" text-anchor="middle">github.com/mhbsiam/doftar/releases</text>
  <path d="M24 110 H524" stroke="#e5e5e8"/>

  <text x="48" y="146" font-size="18" font-weight="700" fill="#1d1d1f">Doftar 1.0.0</text>
  <rect x="170" y="131" width="50" height="20" rx="10" fill="none" stroke="#2da44e" stroke-width="1.3"/>
  <text x="195" y="145" font-size="11" font-weight="600" fill="#2da44e" text-anchor="middle">Latest</text>

  <text x="48" y="186" font-size="13" font-weight="700" fill="#1d1d1f">Assets</text>
  <rect x="48" y="198" width="452" height="132" rx="10" fill="none" stroke="#e2e2e5"/>
  <path d="M48 242 H500 M48 286 H500" stroke="#e2e2e5"/>
  <g fill="none" stroke="#6e6e73" stroke-width="1.6" stroke-linejoin="round">
    <path d="M64 214 l8 -4 l8 4 v10 l-8 4 l-8 -4z M64 214 l8 4 l8 -4 M72 218 v10"/>
    <path d="M64 258 l8 -4 l8 4 v10 l-8 4 l-8 -4z M64 258 l8 4 l8 -4 M72 262 v10"/>
    <path d="M66 300 h8 l4 4 v14 h-12z"/>
  </g>
  <text x="92" y="225" font-size="13" font-weight="600" fill="#0969da">doftar_v1.0.0_stable_macos.dmg</text>
  <text x="92" y="269" font-size="13" fill="#0969da">SHA256SUMS</text>
  <text x="92" y="313" font-size="13" fill="#0969da">Source code (zip)</text>
  <rect x="40" y="200" width="264" height="40" rx="20" fill="none" stroke="#ff9f0a" stroke-width="3.5"/>

  <text x="274" y="366" font-size="13" fill="#8a8a8e" text-anchor="middle">Download the .dmg under Assets</text>
</svg>
