<svg xmlns="http://www.w3.org/2000/svg" viewBox="176 0 368 450" width="368" height="450" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
<!-- Install step 5. See 1-download.svg for how to regenerate the PNGs. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c5c60"/><stop offset="1" stop-color="#464649"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f6"/><stop offset="1" stop-color="#a5a5ab"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <rect x="200" y="25" width="320" height="400" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity="0.16" filter="url(#shadow)"/>
  <circle cx="492" cy="53" r="12" fill="#6c6c70"/>
  <text x="492" y="58" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">?</text>

  <g transform="translate(224 49)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#steel)"/>
    <circle cx="32" cy="32" r="21" fill="#5c5c62"/>
    <circle cx="32" cy="32" r="18.5" fill="none" stroke="#d0d0d4" stroke-width="2" stroke-dasharray="1.5 3.3"/>
    <circle cx="32" cy="32" r="14" fill="url(#steel)" stroke="#3a3a3e"/>
    <path d="M32 21 v8" stroke="#3a3a3e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="4" fill="#3a3a3e"/>
    <path d="M52 38 L66 63 H38 Z" fill="#ffcc00" stroke="#b8860b" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="52" y="60" font-size="15" font-weight="800" fill="#1c1c1e" text-anchor="middle">!</text>
  </g>

  <text x="224" y="143" font-size="15" font-weight="700" fill="#fff">Open “Doftar”?</text>
  <g font-size="13.5" fill="#dcdcde">
    <text x="224" y="167">Apple is not able to verify that it is</text>
    <text x="224" y="186">free from malware that could harm</text>
    <text x="224" y="205">your Mac or compromise your privacy.</text>
    <text x="224" y="224">Don’t open this unless you are certain</text>
    <text x="224" y="243">it is from a trustworthy source.</text>
  </g>

  <rect x="224" y="273" width="272" height="36" rx="18" fill="#0a84ff"/>
  <text x="360" y="296" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Move to Trash</text>
  <rect x="224" y="319" width="272" height="36" rx="18" fill="#6a6a6e"/>
  <text x="360" y="342" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Open Anyway</text>
  <rect x="217" y="312" width="286" height="50" rx="25" fill="none" stroke="#ff9f0a" stroke-width="3.5"/>
  <rect x="224" y="365" width="272" height="36" rx="18" fill="#6a6a6e"/>
  <text x="360" y="388" font-size="14" font-weight="500" fill="#fff" text-anchor="middle">Done</text>
</svg>
