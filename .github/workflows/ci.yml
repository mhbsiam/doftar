name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories against unchanged dependencies show up.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        # Lockfile versions only, and no package install scripts.
        run: npm ci --ignore-scripts

      - name: Type-check and build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Check and test Rust core
        run: |
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Check no networking package reached the frontend
        # Doftar is offline; none of these may be installed, even indirectly.
        run: |
          for p in @tauri-apps/plugin-http @tauri-apps/plugin-updater @tauri-apps/plugin-websocket @tauri-apps/plugin-shell; do
            if npm ls "$p" --depth=100 >/dev/null 2>&1; then
              echo "::error::$p is installed; Doftar makes no network connections"
              exit 1
            fi
          done

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Check licenses and the no-network ban list
        # deny.toml at the repo root: advisories, MIT-compatible licenses, and
        # a ban on every HTTP, TLS and WebSocket crate for the macOS targets.
        run: cargo deny --manifest-path src-tauri/Cargo.toml check
