name: Feature idea
description: Suggest something new. New features aren't being taken right now.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Doftar has one maintainer, who isn't adding new features at the moment.
        You're welcome to share an idea, but it may be closed without being built.
        See [CONTRIBUTING.md](https://github.com/mhbsiam/doftar/blob/main/.github/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Doftar, Finder or another app.
